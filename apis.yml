aid: perchwell
name: Perchwell
description: >-
  Perchwell is a modern, unified MLS (Multiple Listing Service) technology
  platform used by MLS organizations, brokerages, and real estate agents across
  the United States. Founded in 2015 and headquartered in New York City,
  Perchwell provides search, client collaboration, listing add/edit, branded
  reports, and market analytics on a cloud-native, RESO-certified foundation.
  For developers and data partners, Perchwell operates three real estate data
  APIs: a simple token-authenticated JSON API for listing feeds, a RESO Data
  Dictionary certified RESO Web API (OData 4.01) exposing the standard Property,
  Member, Office, OpenHouse, and Media resources with full read/write support,
  and a legacy RETS 1.7 server for backward compatibility. Customers include
  CRMLS, Baldwin REALTORS, Engel & Volkers, and Keller Williams. Perchwell is
  SOC 2 compliant and backed by Lux Capital, Founders Fund, and Starwood Capital.
