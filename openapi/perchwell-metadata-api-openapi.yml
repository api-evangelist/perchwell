openapi: 3.2.0
info:
  title: Perchwell RESO Web Metadata API
  version: v2
  description: Perchwell's RESO Web API is a RESO Data Dictionary certified, OData 4.01 interface for transferring real estate data.
  contact:
    name: Perchwell Support
    email: support@perchwell.com
    url: https://docs.perchwell.com
servers:
- url: https://www.perchwell.com/api/v2/OData/{system}
  description: Production (system is the originating system identifier)
  variables:
    system:
      default: system
      description: The originating system identifier for the MLS/dataset.
security:
- bearerAuth: []
tags:
- name: Metadata
  description: OData service metadata.
paths:
  /$metadata:
    get:
      operationId: getMetadata
      summary: Get OData service metadata
      description: Returns the CSDL metadata document describing resources, fields, and lookup values.
      tags:
      - Metadata
      responses:
        '200':
          description: OData CSDL metadata document.
          content:
            application/xml:
              schema:
                type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Simple token authentication via the Authorization Bearer header.
